---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: dnsrecords.crd.nsx.vmware.com
spec:
  group: crd.nsx.vmware.com
  names:
    categories:
    - nsx
    kind: DNSRecord
    listKind: DNSRecordList
    plural: dnsrecords
    shortNames:
    - dnsrec
    singular: dnsrecord
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Domain name of DNS record
      jsonPath: .spec.domainName
      name: DomainName
      type: string
    - description: Record name
      jsonPath: .spec.recordName
      name: RecordName
      type: string
    - description: Record type
      jsonPath: .spec.recordType
      name: RecordType
      type: string
    - description: FQDN of DNS record
      jsonPath: .spec.fqdn
      name: FQDN
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: DNSRecord is the Schema for the DNS record API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: DNSRecordSpec defines the desired state of DNSRecord.
            properties:
              domainName:
                description: DomainName specifies the DNS domain for this record.
                maxLength: 255
                type: string
                x-kubernetes-validations:
                - message: DomainName is immutable after creation
                  rule: self == oldSelf
              fqdn:
                description: |-
                  FQDN is the system-computed fully qualified domain name, formed by combining RecordName with DomainName.
                  This field is read-only and must not be set in create or update requests.
                type: string
              ipAddress:
                description: IPAddress is the IP address being mapped by a PTR record.
                  Only applicable when RecordType is PTR.
                type: string
              recordName:
                description: |-
                  RecordName specifies the DNS record name or, for PTR records, the host-octet label.
                  For A/AAAA/CNAME: the hostname portion of the FQDN (e.g., "api" for "api.coke.com").
                  For PTR: the host octet of the IP address (e.g., "10" for 10.0.0.10).
                maxLength: 255
                type: string
              recordType:
                description: RecordType specifies the DNS record type.
                enum:
                - A
                - AAAA
                - CNAME
                - PTR
                - NS
                - TXT
                type: string
                x-kubernetes-validations:
                - message: RecordType is immutable after creation
                  rule: self == oldSelf
              recordValues:
                description: RecordValues specifies the DNS record data values.
                items:
                  type: string
                minItems: 1
                type: array
              ttl:
                default: 300
                description: |-
                  TTL specifies the Time-To-Live in seconds for this DNS record.
                  Overrides the zone's default TTL. Range: 0-86400 seconds. Default: 300 (5 minutes).
                format: int32
                maximum: 86400
                minimum: 0
                type: integer
            required:
            - domainName
            - recordName
            - recordType
            - recordValues
            type: object
            x-kubernetes-validations:
            - message: ipAddress can only be set when recordType is PTR
              rule: '!has(self.ipAddress) || self.recordType == ''PTR'''
            - message: CNAME and PTR records must have exactly one value
              rule: '(self.recordType in [''CNAME'', ''PTR'']) ? size(self.recordValues)
                == 1 : true'
          status:
            description: DNSRecordStatus defines the observed state of DNSRecord.
            properties:
              conditions:
                description: Conditions represents the latest available observations
                  of the DNSRecord's current state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
