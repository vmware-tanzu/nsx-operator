---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: ipblockallocationstates.eas.nsx.vmware.com
spec:
  group: eas.nsx.vmware.com
  names:
    kind: IPBlockAllocationState
    listKind: IPBlockAllocationStateList
    plural: ipblockallocationstates
    singular: ipblockallocationstate
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          IPBlockAllocationState represents the allocation state of IP blocks for a VPC.
          It is retrieved via the NSX VPC-scoped IP blocks AllocationState API and exposes
          allocated IPs/CIDRs along with the associated IPAddressAllocation CR names.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          ipBlocks:
            description: IPBlocks contains the allocation state details for each IP
              block within the VPC.
            items:
              description: IPBlockAllocationStateDetails represents the CIDR allocation
                state of an individual IP block in the VPC.
              properties:
                addressType:
                  description: IP address type of the IPBlock. Must be IPv4 or IPv6.
                  enum:
                  - IPv4
                  - IPv6
                  type: string
                allocations:
                  description: Allocations is the list of allocated IPs/CIDRs from
                    this IP block and their associated CR names.
                  items:
                    description: AllocatedCIDR represents an allocated IP or CIDR
                      and its corresponding IPAddressAllocation CR name.
                    properties:
                      allocationPath:
                        description: AllocationPath is the NSX policy path of the
                          corresponding IP address allocation resource.
                        type: string
                      cidr:
                        description: CIDR represents the allocated CIDR or IP address
                          (e.g., "10.0.0.0/24" or "192.168.1.10/32").
                        type: string
                      ipAddressAllocationName:
                        description: |-
                          IPAddressAllocationName is the name of the Kubernetes IPAddressAllocation CR
                          associated with this allocated IP/CIDR.
                        type: string
                    type: object
                  type: array
                  x-kubernetes-list-type: atomic
                allowedUseCases:
                  description: AllowedUseCases surfaces use-case restrictions configured
                    for the IP block (e.g. LB_FRONTEND).
                  items:
                    type: string
                  type: array
                  x-kubernetes-list-type: atomic
                displayName:
                  description: Display name of the IPBlock in NSX.
                  type: string
                ipBlockName:
                  description: Name of the IPBlock in NSX.
                  type: string
                ipBlockPath:
                  description: NSX policy path of the IPBlock (e.g. /infra/ip-blocks/block-1
                    or /orgs/.../projects/.../infra/ip-blocks/block-1).
                  type: string
                visibility:
                  description: Visibility of the IPBlock. Must be External, Private,
                    or PrivateTGW.
                  enum:
                  - External
                  - Private
                  - PrivateTGW
                  type: string
              type: object
            type: array
            x-kubernetes-list-type: atomic
          kind:
