kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: ipblockallocationstates.eas.nsx.vmware.com
spec:
  group: eas.nsx.vmware.com
  names:
    kind: IPBlockAllocationState
    listKind: IPBlockAllocationStateList
    plural: ipblockallocationstates
    singular: ipblockallocationstate
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: IPBlockAllocationState represents the allocation state of all
          CIDRs allocated from an IPBlock.
        properties:
          allocationStates:
            description: State of each CIDR allocated from an IPBlock.
            items:
              description: |-
                IPAddressBlockAllocationStateForCIDR represents the state for a CIDR allocated from an IPBlock.
                The CIDR can be a single IP which is represented as a /32. Or it can be a larger CIDR.
              properties:
                cidr:
                  description: Allocated CIDR from an IPBlock.
                  type: string
                vpcIPAddressAllocationName:
                  description: IPAddressAllocation CR in this Namespace that is associated
                    with this allocated IP/CIDR.
                  type: string
              required:
              - cidr
              type: object
            type: array
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          ipAddressType:
            description: 'IP family of IP addresses: must be IPv4 or IPv6.'
            enum:
            - IPv4
            - IPv6
            type: string
          ipBlockName:
            description: Name of the IPBlock.
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          visibility:
            description: |-
              Visibility of IPBlock.
              Must be External or Private.
            enum:
            - External
            - Private
            type: string
        required:
        - allocationStates
        - visibility
        type: object
    served: true
    storage: true
