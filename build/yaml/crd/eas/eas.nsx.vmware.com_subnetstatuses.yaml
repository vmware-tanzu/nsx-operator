---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: subnetstatuses.eas.nsx.vmware.com
spec:
  group: eas.nsx.vmware.com
  names:
    kind: SubnetStatus
    listKind: SubnetStatusList
    plural: subnetstatuses
    singular: subnetstatus
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          SubnetStatus exposes the realized status of a Subnet.
          It includes DHCP reserved IP ranges, unmanaged IP ranges, dynamic DHCP ranges,
          static IP pool ranges, gateway addresses, network addresses, and VLAN extension status.
          The SubnetStatus name is the same as the Subnet CR name.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          dhcpRanges:
            description: DHCP IP address ranges. The field is populated only for single-resource
              retrieval.
            items:
              type: string
            type: array
          dhcpReservedRanges:
            description: |-
              DHCP reserved IP ranges that are reserved and excluded from being assigned by the DHCP server to clients.
              The field is populated only for single-resource retrieval.
            items:
              type: string
            type: array
          gatewayAddresses:
            description: Gateway address.
            items:
              type: string
            type: array
          ipAddressTypes:
            description: IP address type that will be allocated for VPC Subnets. The
              field is populated only for single-resource retrieval.
            enum:
            - IPv4
            - IPv6
            items:
              type: string
            type: array
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          staticIPPoolRanges:
            description: IP address ranges for static IP allocation. The field is
              populated only for single-resource retrieval.
            items:
              type: string
            type: array
          unmanagedIPs:
            description: |-
              UnmanagedIPs specifies IP addresses or IP ranges in the Subnet CIDR that are unmanaged (not allocated by any IP pool,
              DHCP range, DHCP reserved ranges, or system-reserved addresses like gateway, network, DHCP server, or broadcast).
              The field is populated only for single-resource retrieval.
            items:
              type: string
            type: array
          vlanExtension:
            description: VLAN extension configured for VPC Subnet. The field is populated
              only for single-resource retrieval.
            properties:
              vlanID:
                description: The VLAN ID used for extending to the VPC Subnet.
                format: int32
                type: integer
              vpcGatewayConnectionEnable:
                description: Indicates whether the VPC gateway connection is enabled
                  for this Subnet.
                type: boolean
            required:
            - vlanID
            - vpcGatewayConnectionEnable
            type: object
        type: object
    served: true
    storage: true
