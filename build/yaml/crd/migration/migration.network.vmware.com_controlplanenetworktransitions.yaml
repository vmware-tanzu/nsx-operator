---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: controlplanenetworktransitions.migration.network.vmware.com
spec:
  group: migration.network.vmware.com
  names:
    kind: ControlPlaneNetworkTransition
    listKind: ControlPlaneNetworkTransitionList
    plural: controlplanenetworktransitions
    shortNames:
    - cpnt
    singular: controlplanenetworktransition
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.action
      name: Action
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ControlPlaneNetworkTransition requests Stage 1 infrastructure transition and Stage 3 finalization.
          Rollback is unsupported; failed actions retain checkpoints for forward retry or WCP backup and restore.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Spec describes the requested transition.
            properties:
              action:
                description: Action selects the operation to reconcile. Operations
                  never auto-advance.
                enum:
                - Evaluate
                - Plan
                - Derive
                - Execute
                - Rollback
                - Commit
                - Finalize
                type: string
              networkConfiguration:
                description: |-
                  NetworkConfiguration supplies administrator-provided migration parameters.
                  Values may be added, corrected, or removed during Evaluate before planning.
                  Accepted SNAT reservations freeze the corresponding family's fallback address.
                  Changes require requested action Evaluate; requesting Plan freezes inputs,
                  and a recorded planning checkpoint prevents reopening them.
                properties:
                  controlPlaneAndServiceDHCPNetworks:
                    description: |-
                      ControlPlaneAndServiceDHCPNetworks describes existing DHCP-backed networks used by
                      control-plane VMs and Supervisor Services.
                    items:
                      description: |-
                        DHCPNetworkConfiguration describes existing addressing for a DHCP-backed source VDN.
                        It does not request a new DHCP network. Values may be corrected during Evaluate;
                        the parent transition freezes configuration when planning starts.
                      properties:
                        dhcpRange:
                          description: DHCPRange describes the existing inclusive
                            DHCP pool, not free-IP inventory.
                          properties:
                            end:
                              description: End is the last IP address in the range.
                              maxLength: 45
                              minLength: 1
                              type: string
                              x-kubernetes-validations:
                              - message: end must be a plain IP address
                                rule: isIP(self)
                            start:
                              description: Start is the first IP address in the range.
                              maxLength: 45
                              minLength: 1
                              type: string
                              x-kubernetes-validations:
                              - message: start must be a plain IP address
                                rule: isIP(self)
                          type: object
                        gatewayAddress:
                          description: GatewayAddress supplies a plain gateway IP
                            address without a prefix length.
                          maxLength: 45
                          minLength: 1
                          type: string
                          x-kubernetes-validations:
                          - message: gatewayAddress must be a plain IP address
                            rule: isIP(self)
                        subnetMask:
                          description: SubnetMask is a contiguous dotted-decimal IPv4
                            mask used to derive the subnet CIDR.
                          maxLength: 15
                          minLength: 1
                          pattern: ^((255[.])*(254|252|248|240|224|192|128|0)([.]0)*|255[.]255[.]255[.]255)$
                          type: string
                          x-kubernetes-validations:
                          - message: subnetMask must be a contiguous IPv4 mask in
                              dotted-decimal form
                            rule: isIP(self)
                        vdnName:
                          description: VDNName identifies a discovered source VSphereDistributedNetwork
                            within the Supervisor.
                          maxLength: 256
                          minLength: 1
                          type: string
                      required:
                      - vdnName
                      type: object
                    maxItems: 1000
                    type: array
                    x-kubernetes-list-map-keys:
                    - vdnName
                    x-kubernetes-list-type: map
                  lbSnatIPv4:
                    description: |-
                      LBSNATIPv4 supplies an available backend IPv4 address for the shared NSX LB service
                      when no IPv4 address can be reserved from the VIP pools during evaluation.
                      The migration service must validate availability and reserve the address before use.
                      May be corrected before reservation acceptance; acceptance or Plan freezes the input.
                    maxLength: 15
                    minLength: 1
                    type: string
                    x-kubernetes-validations:
                    - message: lbSnatIPv4 must be a plain IPv4 address
                      rule: isIP(self) && ip(self).family() == 4
                  lbSnatIPv6:
                    description: |-
                      LBSNATIPv6 supplies an available backend IPv6 address for the shared NSX LB service
                      when no IPv6 address can be reserved from the VIP pools during evaluation.
                      The migration service must validate availability and reserve the address before use.
                      May be corrected before reservation acceptance; acceptance or Plan freezes the input.
                    maxLength: 45
                    minLength: 1
                    type: string
                    x-kubernetes-validations:
                    - message: lbSnatIPv6 must be a plain IPv6 address
                      rule: isIP(self) && ip(self).family() == 6
                  legacyLbFrontendDvpgs:
                    description: |-
                      LegacyLBFrontendDVPGs identifies frontend port groups required for HAProxy sources.
                      FLB discovers its backing automatically.
                    items:
                      maxLength: 256
                      minLength: 1
                      type: string
                    maxItems: 1000
                    type: array
                    x-kubernetes-list-type: set
                  resourceNaming:
                    description: |-
                      ResourceNaming supplies optional IDs for NSX resources created for migration.
                      Omitted names use deterministic generated names. Naming inputs never rename
                      or implicitly adopt existing resources and are not requiredInputs.
                    properties:
                      loadBalancerVpcName:
                        description: LoadBalancerVPCName overrides the generated name
                          of the separate LB VPC.
                        maxLength: 255
                        minLength: 1
                        pattern: ^[A-Za-z0-9_.-]+$
                        type: string
                        x-kubernetes-validations:
                        - message: resource name cannot be a dot path segment
                          rule: self != '.' && self != '..'
                      networks:
                        description: |-
                          Networks supplies optional naming overrides per infrastructure VDN.
                          It includes static and DHCP-backed CPVM and Supervisor Service networks.
                        items:
                          description: |-
                            VDNResourceNaming identifies a source VDN by its Kubernetes name, not an
                            internal resource key. Shared topology must resolve to consistent names.
                            Omitted names use deterministic generated names and do not block Evaluate.
                          properties:
                            dvcName:
                              description: DVCName overrides the generated name when
                                a new DVC is needed.
                              maxLength: 255
                              minLength: 1
                              pattern: ^[A-Za-z0-9_.-]+$
                              type: string
                              x-kubernetes-validations:
                              - message: resource name cannot be a dot path segment
                                rule: self != '.' && self != '..'
                            subnetName:
                              description: |-
                                SubnetName overrides the generated name of a new VLAN extension subnet.
                                All backing DVPGs must use the same discovered VLAN and share one subnet
                                under the resolved VPC/span. Evaluate must reject inconsistent VLANs.
                                Existing compatible resources are reused without creation names.
                              maxLength: 255
                              minLength: 1
                              pattern: ^[A-Za-z0-9_.-]+$
                              type: string
                              x-kubernetes-validations:
                              - message: resource name cannot be a dot path segment
                                rule: self != '.' && self != '..'
                            tgwName:
                              description: TGWName overrides the generated name when
                                a new same-span TGW is needed.
                              maxLength: 255
                              minLength: 1
                              pattern: ^[A-Za-z0-9_.-]+$
                              type: string
                              x-kubernetes-validations:
                              - message: resource name cannot be a dot path segment
                                rule: self != '.' && self != '..'
                            vdnName:
                              description: |-
                                VDNName identifies a source VSphereDistributedNetwork used by the batch.
                                Unknown VDNs and conflicting names for shared topology are rejected by Evaluate.
                              maxLength: 253
                              minLength: 1
                              pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                              type: string
                            vpcName:
                              description: VPCName overrides the generated name of
                                a new VPC for this VDN.
                              maxLength: 255
                              minLength: 1
                              pattern: ^[A-Za-z0-9_.-]+$
                              type: string
                              x-kubernetes-validations:
                              - message: resource name cannot be a dot path segment
                                rule: self != '.' && self != '..'
                          required:
                          - vdnName
                          type: object
                        maxItems: 1000
                        type: array
                        x-kubernetes-list-map-keys:
                        - vdnName
                        x-kubernetes-list-type: map
                    type: object
                type: object
              nsxProjectId:
                description: |-
                  NSXProjectID selects a pre-existing NSX project; omission selects the default project.
                  Once supplied, the ID cannot be changed or removed. Omission is fixed when planning starts.
                maxLength: 256
                minLength: 1
                type: string
              sourceMode:
                description: SourceMode is the source network stack.
                enum:
                - VSPHERE_VDS
                minLength: 1
                type: string
              targetLbProvider:
                description: |-
                  TargetLBProvider selects the desired target load balancer provider.
                  In 9.2, only NSX_LB is supported for HAProxy/FLB sources.
                  If omitted, evaluation resolves an unambiguous supported/configured target.
                  The resolved selection is bound to the reviewed plan and cannot change after planning starts.
                enum:
                - NSX_LB
                maxLength: 32
                minLength: 1
                type: string
              targetMode:
                description: TargetMode is the target network stack.
                enum:
                - NSX_VPC
                minLength: 1
                type: string
            required:
            - action
            - sourceMode
            - targetMode
            type: object
            x-kubernetes-validations:
            - message: infrastructure Rollback is unsupported; use WCP backup and
                restore
              rule: self.action != 'Rollback'
            - message: Commit is a namespace operation
              rule: self.action != 'Commit'
            - message: LB SNAT IP inputs apply only to the NSX_LB target provider
              rule: '!has(self.networkConfiguration) || (!has(self.networkConfiguration.lbSnatIPv4)
                && !has(self.networkConfiguration.lbSnatIPv6)) || !has(self.targetLbProvider)
                || self.targetLbProvider == ''NSX_LB'''
            - message: nsxProjectId cannot change once supplied
              rule: '!has(oldSelf.nsxProjectId) || (has(self.nsxProjectId) && self.nsxProjectId
                == oldSelf.nsxProjectId)'
          status:
            description: Status reports observed progress.
            properties:
              actionGeneration:
                description: |-
                  ActionGeneration is the desired-state generation checkpointed for lastAction.
                  It stays unchanged when a newer request is blocked, so previous success cannot satisfy that request.
                format: int64
                minimum: 1
                type: integer
              actionState:
                description: ActionState reports whether lastAction is running, succeeded,
                  or failed.
                enum:
                - Running
                - Succeeded
                - Failed
                type: string
              conditions:
                description: Conditions report the current operation's readiness and
                  failures.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 32
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              detectedSourceLbProvider:
                description: |-
                  DetectedSourceLBProvider identifies the discovered source load balancer provider.
                  In 9.2, HAPROXY and VSPHERE_FOUNDATION (FLB) are supported.
                  Unsupported discovered providers are reported through failure conditions.
                enum:
                - HAPROXY
                - VSPHERE_FOUNDATION
                maxLength: 32
                minLength: 1
                type: string
              irreversibleAction:
                description: |-
                  IrreversibleAction identifies the action whose point of no return has been persisted.
                  It is set only after prerequisite checks and before irreversible external changes.
                  Once set, only that action may be resumed and this checkpoint cannot be cleared.
                enum:
                - Commit
                - Finalize
                type: string
              lastAction:
                description: LastAction identifies the most recently checkpointed
                  operation, regardless of outcome.
                enum:
                - Evaluate
                - Plan
                - Derive
                - Execute
                - Rollback
                - Commit
                - Finalize
                type: string
              lbSnatReservations:
                description: |-
                  LBSNATReservations records accepted reservations and freezes the corresponding SNAT inputs.
                  Retain checkpoints for recovery; they do not themselves reserve or release any address.
                items:
                  description: |-
                    LBSNATReservationStatus records an accepted source reservation, not an allocation request.
                    The controller verifies ownership and readiness before persisting this checkpoint.
                  properties:
                    allocationRef:
                      description: AllocationRef binds the reservation to the source
                        allocation's namespace and name.
                      properties:
                        name:
                          description: Name identifies the source IPAddressAllocation
                            for Kubernetes API lookups.
                          maxLength: 253
                          minLength: 1
                          type: string
                        namespace:
                          description: Namespace identifies the source allocation's
                            Kubernetes namespace.
                          maxLength: 63
                          minLength: 1
                          type: string
                      required:
                      - name
                      - namespace
                      type: object
                    ipAddress:
                      description: IPAddress is the address realized by the source
                        allocation.
                      maxLength: 45
                      minLength: 1
                      type: string
                    ipFamily:
                      description: IPFamily identifies the reserved address family.
                      enum:
                      - IPv4
                      - IPv6
                      type: string
                  required:
                  - allocationRef
                  - ipAddress
                  - ipFamily
                  type: object
                  x-kubernetes-validations:
                  - message: accepted LB SNAT reservation identity is immutable
                    rule: self == oldSelf
                  - message: reserved address must match its IP family
                    rule: 'isIP(self.ipAddress) && ip(self.ipAddress).family() ==
                      (self.ipFamily == ''IPv4'' ? 4 : 6)'
                maxItems: 2
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - ipFamily
                x-kubernetes-list-type: map
                x-kubernetes-validations:
                - message: accepted LB SNAT reservation checkpoints cannot be removed
                  rule: oldSelf.all(r, self.exists(n, n.ipFamily == r.ipFamily))
              loadBalancerVpcPath:
                description: LoadBalancerVPCPath is the full path of the load balancer
                  VPC.
                maxLength: 1024
                minLength: 1
                type: string
              nsxWorkflows:
                description: NSXWorkflows records the exact external workflow handle
                  for each source VDN.
                items:
                  description: NSXWorkflowStatus records a resumable NSX conversion
                    workflow for one source VDN.
                  properties:
                    vdnName:
                      description: VDNName identifies the source VSphereDistributedNetwork
                        for this workflow.
                      maxLength: 256
                      minLength: 1
                      type: string
                    workflowId:
                      description: WorkflowID is the persisted NSX handle used for
                        retries, rollback, and cleanup.
                      maxLength: 256
                      minLength: 1
                      type: string
                  required:
                  - vdnName
                  - workflowId
                  type: object
                maxItems: 1000
                type: array
                x-kubernetes-list-map-keys:
                - vdnName
                x-kubernetes-list-type: map
              observedGeneration:
                description: |-
                  ObservedGeneration is the desired-state generation last inspected, even if its action was blocked.
                  It indicates status freshness and does not mean the action ran or succeeded.
                format: int64
                minimum: 1
                type: integer
              optionalInputs:
                description: |-
                  OptionalInputs describe optional overrides the UI may offer during Evaluate.
                  Omitting these inputs uses defaults and does not block evaluation. Handlers
                  publish/clear them with RequiredInputs for ObservedGeneration, remove frozen
                  resource names, and revalidate live eligibility before accepting overrides.
                  This is advisory UI information, not a resource inventory or a review gate.
                items:
                  description: |-
                    OptionalInput describes an optional administrator input; omission uses defaults.
                    It has the same key/description shape as RequiredInput without blocking progress.
                  properties:
                    description:
                      description: Description identifies the VDN/resource and explains
                        the default on omission.
                      maxLength: 4096
                      minLength: 1
                      type: string
                    key:
                      description: Key identifies the spec field the UI can offer,
                        including a VDN selector.
                      maxLength: 1024
                      minLength: 1
                      type: string
                  required:
                  - description
                  - key
                  type: object
                maxItems: 5000
                type: array
                x-kubernetes-list-map-keys:
                - key
                x-kubernetes-list-type: map
              phase:
                description: Phase describes current progress; Blocked means prerequisites
                  or handlers are unavailable.
                maxLength: 64
                minLength: 1
                type: string
              primaryVpcPath:
                description: PrimaryVPCPath is the full path of the infrastructure
                  VPC.
                maxLength: 1024
                minLength: 1
                type: string
              requiredInputs:
                description: RequiredInputs describe administrator inputs required
                  before proceeding.
                items:
                  description: RequiredInput describes administrator input needed
                    to proceed.
                  properties:
                    description:
                      description: Description explains how to supply the input.
                      maxLength: 4096
                      minLength: 1
                      type: string
                    key:
                      description: Key identifies the missing input.
                      maxLength: 1024
                      minLength: 1
                      type: string
                  required:
                  - description
                  - key
                  type: object
                maxItems: 1000
                type: array
                x-kubernetes-list-map-keys:
                - key
                x-kubernetes-list-type: map
              targetLbProvider:
                description: TargetLBProvider identifies the resolved target provider;
                  only NSX_LB is supported in 9.2.
                enum:
                - NSX_LB
                maxLength: 32
                minLength: 1
                type: string
              targetNsxProject:
                description: TargetNSXProject is the full path of the resolved pre-existing
                  NSX project.
                maxLength: 1024
                minLength: 1
                type: string
            type: object
            x-kubernetes-validations:
            - message: infrastructure irreversibleAction must be Finalize
              rule: '!has(self.irreversibleAction) || self.irreversibleAction == ''Finalize'''
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: LB SNAT inputs may only be added, corrected or removed with Evaluate
          rule: self.spec.action == 'Evaluate' || (((has(self.spec.networkConfiguration)
            && has(self.spec.networkConfiguration.lbSnatIPv4)) == (has(oldSelf.spec.networkConfiguration)
            && has(oldSelf.spec.networkConfiguration.lbSnatIPv4)) && (!(has(oldSelf.spec.networkConfiguration)
            && has(oldSelf.spec.networkConfiguration.lbSnatIPv4)) || self.spec.networkConfiguration.lbSnatIPv4
            == oldSelf.spec.networkConfiguration.lbSnatIPv4)) && ((has(self.spec.networkConfiguration)
            && has(self.spec.networkConfiguration.lbSnatIPv6)) == (has(oldSelf.spec.networkConfiguration)
            && has(oldSelf.spec.networkConfiguration.lbSnatIPv6)) && (!(has(oldSelf.spec.networkConfiguration)
            && has(oldSelf.spec.networkConfiguration.lbSnatIPv6)) || self.spec.networkConfiguration.lbSnatIPv6
            == oldSelf.spec.networkConfiguration.lbSnatIPv6)))
        - message: lbSnatIPv4 cannot change after its reservation is accepted
          rule: '!has(oldSelf.status) || !has(oldSelf.status.lbSnatReservations) ||
            !oldSelf.status.lbSnatReservations.exists(r, r.ipFamily == ''IPv4'') ||
            ((has(self.spec.networkConfiguration) && has(self.spec.networkConfiguration.lbSnatIPv4))
            == (has(oldSelf.spec.networkConfiguration) && has(oldSelf.spec.networkConfiguration.lbSnatIPv4))
            && (!(has(oldSelf.spec.networkConfiguration) && has(oldSelf.spec.networkConfiguration.lbSnatIPv4))
            || self.spec.networkConfiguration.lbSnatIPv4 == oldSelf.spec.networkConfiguration.lbSnatIPv4))'
        - message: lbSnatIPv6 cannot change after its reservation is accepted
          rule: '!has(oldSelf.status) || !has(oldSelf.status.lbSnatReservations) ||
            !oldSelf.status.lbSnatReservations.exists(r, r.ipFamily == ''IPv6'') ||
            ((has(self.spec.networkConfiguration) && has(self.spec.networkConfiguration.lbSnatIPv6))
            == (has(oldSelf.spec.networkConfiguration) && has(oldSelf.spec.networkConfiguration.lbSnatIPv6))
            && (!(has(oldSelf.spec.networkConfiguration) && has(oldSelf.spec.networkConfiguration.lbSnatIPv6))
            || self.spec.networkConfiguration.lbSnatIPv6 == oldSelf.spec.networkConfiguration.lbSnatIPv6))'
        - message: accepted LB SNAT reservation checkpoints must be retained
          rule: '!has(oldSelf.status) || !has(oldSelf.status.lbSnatReservations) ||
            (has(self.status) && has(self.status.lbSnatReservations))'
        - message: targetLbProvider cannot change after an LB SNAT reservation is
            accepted
          rule: '!has(oldSelf.status) || !has(oldSelf.status.lbSnatReservations) ||
            (has(self.spec.targetLbProvider) == has(oldSelf.spec.targetLbProvider)
            && (!has(oldSelf.spec.targetLbProvider) || self.spec.targetLbProvider
            == oldSelf.spec.targetLbProvider))'
        - message: nsxProjectId cannot change after an LB SNAT reservation is accepted
          rule: '!has(oldSelf.status) || !has(oldSelf.status.lbSnatReservations) ||
            (has(self.spec.nsxProjectId) == has(oldSelf.spec.nsxProjectId) && (!has(oldSelf.spec.nsxProjectId)
            || self.spec.nsxProjectId == oldSelf.spec.nsxProjectId))'
        - message: networkConfiguration may only change with Evaluate
          rule: self.spec.action == 'Evaluate' || (has(self.spec.networkConfiguration)
            == has(oldSelf.spec.networkConfiguration) && (!has(oldSelf.spec.networkConfiguration)
            || self.spec.networkConfiguration == oldSelf.spec.networkConfiguration))
        - message: targetLbProvider may only change with Evaluate
          rule: self.spec.action == 'Evaluate' || (has(self.spec.targetLbProvider)
            == has(oldSelf.spec.targetLbProvider) && (!has(oldSelf.spec.targetLbProvider)
            || self.spec.targetLbProvider == oldSelf.spec.targetLbProvider))
        - message: nsxProjectId may only change with Evaluate
          rule: self.spec.action == 'Evaluate' || (has(self.spec.nsxProjectId) ==
            has(oldSelf.spec.nsxProjectId) && (!has(oldSelf.spec.nsxProjectId) ||
            self.spec.nsxProjectId == oldSelf.spec.nsxProjectId))
        - message: targetLbProvider cannot change after planning starts
          rule: '!has(oldSelf.status) || !has(oldSelf.status.lastAction) || !(oldSelf.status.lastAction
            in [''Plan'', ''Derive'', ''Execute'', ''Rollback'', ''Finalize'']) ||
            (has(self.spec.targetLbProvider) == has(oldSelf.spec.targetLbProvider)
            && (!has(oldSelf.spec.targetLbProvider) || self.spec.targetLbProvider
            == oldSelf.spec.targetLbProvider))'
        - message: nsxProjectId cannot change after planning starts
          rule: '!has(oldSelf.status) || !has(oldSelf.status.lastAction) || !(oldSelf.status.lastAction
            in [''Plan'', ''Derive'', ''Execute'', ''Rollback'', ''Finalize'']) ||
            (has(self.spec.nsxProjectId) == has(oldSelf.spec.nsxProjectId) && (!has(oldSelf.spec.nsxProjectId)
            || self.spec.nsxProjectId == oldSelf.spec.nsxProjectId))'
        - message: networkConfiguration cannot change after planning starts
          rule: '!has(oldSelf.status) || !has(oldSelf.status.lastAction) || !(oldSelf.status.lastAction
            in [''Plan'', ''Derive'', ''Execute'', ''Rollback'', ''Finalize'']) ||
            (has(self.spec.networkConfiguration) == has(oldSelf.spec.networkConfiguration)
            && (!has(oldSelf.spec.networkConfiguration) || self.spec.networkConfiguration
            == oldSelf.spec.networkConfiguration))'
        - message: an irreversible checkpoint cannot change or be cleared; only its
            action may be resumed
          rule: '!has(oldSelf.status) || !has(oldSelf.status.irreversibleAction) ||
            (has(self.status) && has(self.status.irreversibleAction) && self.status.irreversibleAction
            == oldSelf.status.irreversibleAction && self.spec.action == oldSelf.status.irreversibleAction)'
        - message: an irreversible checkpoint requires the corresponding spec.action
          rule: '!has(self.status) || !has(self.status.irreversibleAction) || self.spec.action
            == self.status.irreversibleAction'
        - message: the infrastructure transition must be named supervisor-vds-to-vpc
          rule: self.metadata.name == 'supervisor-vds-to-vpc'
    served: true
    storage: true
    subresources:
      status: {}
