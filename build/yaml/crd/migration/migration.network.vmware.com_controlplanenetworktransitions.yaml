---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: controlplanenetworktransitions.migration.network.vmware.com
spec:
  group: migration.network.vmware.com
  names:
    kind: ControlPlaneNetworkTransition
    listKind: ControlPlaneNetworkTransitionList
    plural: controlplanenetworktransitions
    shortNames:
    - cpnt
    singular: controlplanenetworktransition
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.action
      name: Action
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ControlPlaneNetworkTransition requests Stage 1 infrastructure transition and Stage 3 finalization.
          Rollback is unsupported; failed actions retain checkpoints for forward retry or WCP backup and restore.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Spec describes the requested transition.
            properties:
              action:
                description: Action selects the operation to reconcile. Operations
                  never auto-advance.
                enum:
                - Evaluate
                - Plan
                - Derive
                - Execute
                - Rollback
                - Commit
                - Finalize
                type: string
              networkConfiguration:
                description: |-
                  NetworkConfiguration supplies administrator-provided migration parameters.
                  Values may be added, corrected, or removed during Evaluate before planning.
                  Accepted SNAT reservations freeze the IPv4 fallback address.
                  Changes require requested action Evaluate; requesting Plan freezes inputs,
                  and a recorded planning checkpoint prevents reopening them.
                properties:
                  controlPlaneAndServiceDHCPNetworks:
                    description: |-
                      ControlPlaneAndServiceDHCPNetworks describes existing DHCP-backed networks used by
                      control-plane VMs and Supervisor Services.
                    items:
                      description: |-
                        DHCPNetworkConfiguration describes existing addressing for a DHCP-backed source VDN.
                        It does not request a new DHCP network. Values may be corrected during Evaluate;
                        the parent transition freezes configuration when planning starts.
                      properties:
                        dhcpRange:
                          description: DHCPRange describes the existing inclusive
                            DHCP pool, not free-IP inventory.
                          properties:
                            end:
                              description: End is the last IPv4 address in the existing
                                DHCP range.
                              maxLength: 45
                              minLength: 1
                              type: string
                              x-kubernetes-validations:
                              - message: end must be a plain IPv4 address
                                rule: isIP(self) && ip(self).family() == 4
                            start:
                              description: Start is the first IPv4 address in the
                                existing DHCP range.
                              maxLength: 45
                              minLength: 1
                              type: string
                              x-kubernetes-validations:
                              - message: start must be a plain IPv4 address
                                rule: isIP(self) && ip(self).family() == 4
                          type: object
                        gatewayAddress:
                          description: GatewayAddress supplies the existing IPv4 gateway
                            without a prefix length.
                          maxLength: 45
                          minLength: 1
                          type: string
                          x-kubernetes-validations:
                          - message: gatewayAddress must be a plain IPv4 address
                            rule: isIP(self) && ip(self).family() == 4
                        subnetMask:
                          description: SubnetMask is a contiguous dotted-decimal IPv4
                            mask used to derive the subnet CIDR.
                          maxLength: 15
                          minLength: 1
                          pattern: ^((255[.])*(254|252|248|240|224|192|128|0)([.]0)*|255[.]255[.]255[.]255)$
                          type: string
                          x-kubernetes-validations:
                          - message: subnetMask must be a contiguous IPv4 mask in
                              dotted-decimal form
                            rule: isIP(self)
                        vdnName:
                          description: VDNName identifies a discovered source VSphereDistributedNetwork
                            within the Supervisor.
                          maxLength: 256
                          minLength: 1
                          type: string
                      required:
                      - vdnName
                      type: object
                    maxItems: 1000
                    type: array
                    x-kubernetes-list-map-keys:
                    - vdnName
                    x-kubernetes-list-type: map
                  lbSnatIPs:
                    description: |-
                      LBSNATIPs optionally supplies a backend IPv4 address for the shared NSX LB
                      service when the IPv4 VIP pool cannot provide a reservation during Evaluate.
                      Supervisor VDS source networks are IPv4-only in this release. Keep this as a
                      slice so a later release can add IPv6 without changing the field shape.
                      The migration service validates availability and reserves the supplied address
                      before use. An accepted allocation freezes this input; Plan freezes the entire configuration.
                    items:
                      maxLength: 45
                      minLength: 1
                      type: string
                    maxItems: 1
                    type: array
                    x-kubernetes-list-type: set
                    x-kubernetes-validations:
                    - message: lbSnatIPs must contain only plain IPv4 addresses for
                        Supervisor VDS migration
                      rule: self.all(address, isIP(address) && ip(address).family()
                        == 4)
                  resourceNaming:
                    description: |-
                      ResourceNaming supplies optional IDs for NSX resources created for migration.
                      Omitted names use deterministic generated names. Naming inputs never rename
                      or implicitly adopt existing resources and are not requiredInputs.
                    properties:
                      loadBalancerVpcName:
                        description: LoadBalancerVPCName overrides the generated name
                          of the separate LB VPC.
                        maxLength: 255
                        minLength: 1
                        pattern: ^[A-Za-z0-9_.-]+$
                        type: string
                        x-kubernetes-validations:
                        - message: resource name cannot be a dot path segment
                          rule: self != '.' && self != '..'
                      networks:
                        description: |-
                          Networks supplies optional naming overrides per infrastructure VDN.
                          It includes static and DHCP-backed CPVM and Supervisor Service networks.
                        items:
                          description: |-
                            VDNResourceNaming identifies a source VDN by its Kubernetes name, not an
                            internal resource key. Shared topology must resolve to consistent names.
                            Omitted names use deterministic generated names and do not block Evaluate.
                          properties:
                            dvcName:
                              description: DVCName overrides the generated name when
                                a new DVC is needed.
                              maxLength: 255
                              minLength: 1
                              pattern: ^[A-Za-z0-9_.-]+$
                              type: string
                              x-kubernetes-validations:
                              - message: resource name cannot be a dot path segment
                                rule: self != '.' && self != '..'
                            subnetName:
                              description: |-
                                SubnetName overrides the generated name of a new VLAN extension subnet.
                                All backing DVPGs must use the same discovered VLAN and share one subnet
                                under the resolved VPC/span. Evaluate must reject inconsistent VLANs.
                                Existing compatible resources are reused without creation names.
                              maxLength: 255
                              minLength: 1
                              pattern: ^[A-Za-z0-9_.-]+$
                              type: string
                              x-kubernetes-validations:
                              - message: resource name cannot be a dot path segment
                                rule: self != '.' && self != '..'
                            tgwName:
                              description: TGWName overrides the generated name when
                                a new same-span TGW is needed.
                              maxLength: 255
                              minLength: 1
                              pattern: ^[A-Za-z0-9_.-]+$
                              type: string
                              x-kubernetes-validations:
                              - message: resource name cannot be a dot path segment
                                rule: self != '.' && self != '..'
                            vdnName:
                              description: |-
                                VDNName identifies a source VSphereDistributedNetwork used by the batch.
                                Unknown VDNs and conflicting names for shared topology are rejected by Evaluate.
                              maxLength: 253
                              minLength: 1
                              pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                              type: string
                            vpcName:
                              description: VPCName overrides the generated name of
                                a new VPC for this VDN.
                              maxLength: 255
                              minLength: 1
                              pattern: ^[A-Za-z0-9_.-]+$
                              type: string
                              x-kubernetes-validations:
                              - message: resource name cannot be a dot path segment
                                rule: self != '.' && self != '..'
                          required:
                          - vdnName
                          type: object
                        maxItems: 1000
                        type: array
                        x-kubernetes-list-map-keys:
                        - vdnName
                        x-kubernetes-list-type: map
                    type: object
                  sourceLbFrontendDvpgs:
                    description: |-
                      SourceLBFrontendDVPGs identifies the Supervisor frontend port groups on VDS
                      used by the source load balancer. HAProxy requires these inputs; other source
                      providers may use them when supported. FLB discovers its frontend networks.
                    items:
                      maxLength: 256
                      minLength: 1
                      type: string
                    maxItems: 1000
                    type: array
                    x-kubernetes-list-type: set
                type: object
              nsxProjectId:
                description: |-
                  NSXProjectID selects a pre-existing NSX project; omission selects the default project.
                  Once supplied, the ID cannot be changed or removed. Omission is fixed when planning starts.
                maxLength: 256
                minLength: 1
                type: string
              sourceMode:
                description: SourceMode is the source network stack.
                enum:
                - VSPHERE_VDS
                minLength: 1
                type: string
              targetLbProvider:
                description: |-
                  TargetLBProvider selects the desired target load balancer provider.
                  In 9.2, only NSX_LB is supported for HAProxy/FLB sources.
                  If omitted, evaluation resolves an unambiguous supported/configured target.
                  The resolved selection is bound to the reviewed plan and cannot change after planning starts.
                enum:
                - NSX_LB
                maxLength: 32
                minLength: 1
                type: string
              targetMode:
                description: TargetMode is the target network stack.
                enum:
                - NSX_VPC
                minLength: 1
                type: string
            required:
            - action
            - sourceMode
            - targetMode
            type: object
            x-kubernetes-validations:
            - message: infrastructure Rollback is unsupported; use WCP backup and
                restore
              rule: self.action != 'Rollback'
            - message: Commit is a Namespace operation
              rule: self.action != 'Commit'
            - message: LB SNAT IP inputs apply only to the NSX_LB target provider
              rule: '!has(self.networkConfiguration) || !has(self.networkConfiguration.lbSnatIPs)
                || size(self.networkConfiguration.lbSnatIPs) == 0 || !has(self.targetLbProvider)
                || self.targetLbProvider == ''NSX_LB'''
            - message: nsxProjectId cannot change once supplied
              rule: '!has(oldSelf.nsxProjectId) || (has(self.nsxProjectId) && self.nsxProjectId
                == oldSelf.nsxProjectId)'
          status:
            description: Status reports observed progress.
            properties:
              actionGeneration:
                description: |-
                  ActionGeneration is the desired-state generation checkpointed for lastAction.
                  It stays unchanged when a newer request is blocked, so previous success cannot satisfy that request.
                format: int64
                minimum: 1
                type: integer
              actionState:
                description: ActionState reports whether lastAction is running, succeeded,
                  or failed.
                enum:
                - Running
                - Succeeded
                - Failed
                type: string
              conditions:
                description: Conditions report the current operation's readiness and
                  failures.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 32
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              detectedSourceLbProvider:
                description: |-
                  DetectedSourceLBProvider identifies the discovered source load balancer provider.
                  In 9.2, HAPROXY and VSPHERE_FOUNDATION (FLB) are supported.
                  Unsupported discovered providers are reported through failure conditions.
                enum:
                - HAPROXY
                - VSPHERE_FOUNDATION
                maxLength: 32
                minLength: 1
                type: string
              irreversibleAction:
                description: |-
                  IrreversibleAction identifies the action whose point of no return has been persisted.
                  It is set only after prerequisite checks and before irreversible external changes.
                  Once set, only that action may be resumed and this checkpoint cannot be cleared.
                enum:
                - Commit
                - Finalize
                type: string
              lastAction:
                description: LastAction identifies the most recently checkpointed
                  operation, regardless of outcome.
                enum:
                - Evaluate
                - Plan
                - Derive
                - Execute
                - Rollback
                - Commit
                - Finalize
                type: string
              lbSnatIPAllocations:
                description: |-
                  LBSNATIPAllocations records the accepted IPv4 allocation and locks its input
                  against edits. Retain this checkpoint for recovery; it does not itself
                  reserve or release any address.
                items:
                  description: |-
                    IPAllocationStatus records an accepted LB SNAT IP allocation checkpoint.
                    The controller verifies ownership and readiness before persisting it.
                  properties:
                    allocationRef:
                      description: |-
                        AllocationRef identifies the source allocation when one was created.
                        It uses the shared NamespacedName type and is omitted for an administrator-supplied
                        backend address without a source allocation.
                      properties:
                        name:
                          description: Name of the referent.
                          maxLength: 253
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                          type: string
                        namespace:
                          description: Namespace of the referent.
                          maxLength: 63
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                          type: string
                      required:
                      - name
                      - namespace
                      type: object
                    ipAddress:
                      description: IPAddress is the address accepted for LB SNAT,
                        from a source allocation or user input.
                      maxLength: 45
                      minLength: 1
                      type: string
                  required:
                  - ipAddress
                  type: object
                  x-kubernetes-validations:
                  - message: accepted LB SNAT allocation identity is immutable
                    rule: self == oldSelf
                  - message: allocated address must be a plain IP address
                    rule: isIP(self.ipAddress)
                maxItems: 1
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - ipAddress
                x-kubernetes-list-type: map
                x-kubernetes-validations:
                - message: accepted LB SNAT allocation checkpoints cannot be removed
                  rule: oldSelf.all(r, self.exists(n, n.ipAddress == r.ipAddress))
                - message: Supervisor VDS migration supports only IPv4 LB SNAT allocations
                  rule: self.all(a, isIP(a.ipAddress) && ip(a.ipAddress).family()
                    == 4)
              loadBalancerVpcPath:
                description: LoadBalancerVPCPath is the full path of the load balancer
                  VPC.
                maxLength: 1024
                minLength: 1
                type: string
              nsxWorkflows:
                description: NSXWorkflows records the exact external workflow handle
                  for each source VDN.
                items:
                  description: NSXWorkflowStatus records a resumable NSX conversion
                    workflow for one source VDN.
                  properties:
                    vdnName:
                      description: VDNName identifies the source VSphereDistributedNetwork
                        for this workflow.
                      maxLength: 256
                      minLength: 1
                      type: string
                    workflowId:
                      description: WorkflowID is the persisted NSX handle used for
                        retries, rollback, and cleanup.
                      maxLength: 256
                      minLength: 1
                      type: string
                  required:
                  - vdnName
                  - workflowId
                  type: object
                maxItems: 1000
                type: array
                x-kubernetes-list-map-keys:
                - vdnName
                x-kubernetes-list-type: map
              observedGeneration:
                description: |-
                  ObservedGeneration is the desired-state generation last inspected, even if its action was blocked.
                  It indicates status freshness and does not mean the action ran or succeeded.
                format: int64
                minimum: 1
                type: integer
              optionalInputs:
                description: |-
                  OptionalInputs describe optional overrides the UI may offer during Evaluate.
                  Omitting these inputs uses defaults and does not block evaluation. Handlers
                  publish/clear them with RequiredInputs for ObservedGeneration, remove frozen
                  resource names, and revalidate live eligibility before accepting overrides.
                  This is advisory UI information, not a resource inventory or a review gate.
                items:
                  description: |-
                    OptionalInput describes an optional administrator input; omission uses defaults.
                    It has the same key/description shape as RequiredInput without blocking progress.
                  properties:
                    description:
                      description: Description identifies the VDN/resource and explains
                        the default on omission.
                      maxLength: 4096
                      minLength: 1
                      type: string
                    key:
                      description: Key identifies the spec field path the UI can offer,
                        including a VDN selector.
                      maxLength: 1024
                      minLength: 1
                      type: string
                  required:
                  - description
                  - key
                  type: object
                maxItems: 5000
                type: array
                x-kubernetes-list-map-keys:
                - key
                x-kubernetes-list-type: map
              phase:
                description: Phase describes current progress; Blocked means prerequisites
                  or handlers are unavailable.
                maxLength: 64
                minLength: 1
                type: string
              primaryVpcPath:
                description: PrimaryVPCPath is the full path of the infrastructure
                  VPC.
                maxLength: 1024
                minLength: 1
                type: string
              requiredInputs:
                description: RequiredInputs describe administrator inputs required
                  before proceeding.
                items:
                  description: RequiredInput describes administrator input needed
                    to proceed.
                  properties:
                    description:
                      description: Description explains how to supply the input.
                      maxLength: 4096
                      minLength: 1
                      type: string
                    key:
                      description: Key identifies the missing spec field path, including
                        any VDN selector.
                      maxLength: 1024
                      minLength: 1
                      type: string
                  required:
                  - description
                  - key
                  type: object
                maxItems: 1000
                type: array
                x-kubernetes-list-map-keys:
                - key
                x-kubernetes-list-type: map
              targetLbProvider:
                description: TargetLBProvider identifies the resolved target provider;
                  only NSX_LB is supported in 9.2.
                enum:
                - NSX_LB
                maxLength: 32
                minLength: 1
                type: string
              targetNsxProjectPath:
                description: TargetNSXProjectPath is the full path of the resolved
                  pre-existing NSX project.
                maxLength: 1024
                minLength: 1
                type: string
            type: object
            x-kubernetes-validations:
            - message: infrastructure irreversibleAction must be Finalize
              rule: '!has(self.irreversibleAction) || self.irreversibleAction == ''Finalize'''
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: IPv4 LB SNAT input cannot change after its allocation is accepted
          rule: '!has(oldSelf.status) || !has(oldSelf.status.lbSnatIPAllocations)
            || !oldSelf.status.lbSnatIPAllocations.exists(r, ip(r.ipAddress).family()
            == 4) || ((has(self.spec.networkConfiguration) && has(self.spec.networkConfiguration.lbSnatIPs))
            ? self.spec.networkConfiguration.lbSnatIPs.filter(address, ip(address).family()
            == 4) : []) == ((has(oldSelf.spec.networkConfiguration) && has(oldSelf.spec.networkConfiguration.lbSnatIPs))
            ? oldSelf.spec.networkConfiguration.lbSnatIPs.filter(address, ip(address).family()
            == 4) : [])'
        - message: accepted LB SNAT allocation checkpoints must be retained
          rule: '!has(oldSelf.status) || !has(oldSelf.status.lbSnatIPAllocations)
            || (has(self.status) && has(self.status.lbSnatIPAllocations))'
        - message: targetLbProvider cannot change after an LB SNAT allocation is accepted
          rule: '!has(oldSelf.status) || !has(oldSelf.status.lbSnatIPAllocations)
            || (has(self.spec.targetLbProvider) == has(oldSelf.spec.targetLbProvider)
            && (!has(oldSelf.spec.targetLbProvider) || self.spec.targetLbProvider
            == oldSelf.spec.targetLbProvider))'
        - message: nsxProjectId cannot change after an LB SNAT allocation is accepted
          rule: '!has(oldSelf.status) || !has(oldSelf.status.lbSnatIPAllocations)
            || (has(self.spec.nsxProjectId) == has(oldSelf.spec.nsxProjectId) && (!has(oldSelf.spec.nsxProjectId)
            || self.spec.nsxProjectId == oldSelf.spec.nsxProjectId))'
        - message: networkConfiguration may only change with Evaluate
          rule: self.spec.action == 'Evaluate' || (has(self.spec.networkConfiguration)
            == has(oldSelf.spec.networkConfiguration) && (!has(oldSelf.spec.networkConfiguration)
            || self.spec.networkConfiguration == oldSelf.spec.networkConfiguration))
        - message: targetLbProvider may only change with Evaluate
          rule: self.spec.action == 'Evaluate' || (has(self.spec.targetLbProvider)
            == has(oldSelf.spec.targetLbProvider) && (!has(oldSelf.spec.targetLbProvider)
            || self.spec.targetLbProvider == oldSelf.spec.targetLbProvider))
        - message: nsxProjectId may only change with Evaluate
          rule: self.spec.action == 'Evaluate' || (has(self.spec.nsxProjectId) ==
            has(oldSelf.spec.nsxProjectId) && (!has(oldSelf.spec.nsxProjectId) ||
            self.spec.nsxProjectId == oldSelf.spec.nsxProjectId))
        - message: targetLbProvider cannot change after planning starts
          rule: '!has(oldSelf.status) || !has(oldSelf.status.lastAction) || !(oldSelf.status.lastAction
            in [''Plan'', ''Derive'', ''Execute'', ''Rollback'', ''Finalize'']) ||
            (has(self.spec.targetLbProvider) == has(oldSelf.spec.targetLbProvider)
            && (!has(oldSelf.spec.targetLbProvider) || self.spec.targetLbProvider
            == oldSelf.spec.targetLbProvider))'
        - message: nsxProjectId cannot change after planning starts
          rule: '!has(oldSelf.status) || !has(oldSelf.status.lastAction) || !(oldSelf.status.lastAction
            in [''Plan'', ''Derive'', ''Execute'', ''Rollback'', ''Finalize'']) ||
            (has(self.spec.nsxProjectId) == has(oldSelf.spec.nsxProjectId) && (!has(oldSelf.spec.nsxProjectId)
            || self.spec.nsxProjectId == oldSelf.spec.nsxProjectId))'
        - message: networkConfiguration cannot change after planning starts
          rule: '!has(oldSelf.status) || !has(oldSelf.status.lastAction) || !(oldSelf.status.lastAction
            in [''Plan'', ''Derive'', ''Execute'', ''Rollback'', ''Finalize'']) ||
            (has(self.spec.networkConfiguration) == has(oldSelf.spec.networkConfiguration)
            && (!has(oldSelf.spec.networkConfiguration) || self.spec.networkConfiguration
            == oldSelf.spec.networkConfiguration))'
        - message: an irreversible checkpoint cannot change or be cleared; only its
            action may be resumed
          rule: '!has(oldSelf.status) || !has(oldSelf.status.irreversibleAction) ||
            (has(self.status) && has(self.status.irreversibleAction) && self.status.irreversibleAction
            == oldSelf.status.irreversibleAction && self.spec.action == oldSelf.status.irreversibleAction)'
        - message: an irreversible checkpoint requires the corresponding spec.action
          rule: '!has(self.status) || !has(self.status.irreversibleAction) || self.spec.action
            == self.status.irreversibleAction'
        - message: the infrastructure transition must be named supervisor-vds-to-vpc
          rule: self.metadata.name == 'supervisor-vds-to-vpc'
    served: true
    storage: true
    subresources:
      status: {}
