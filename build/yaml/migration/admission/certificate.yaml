kind: Certificate
metadata:
  name: supervisor-network-migration-admission
  namespace: vmware-system-nsx
spec:
  dnsNames:
    - supervisor-network-migration-admission.vmware-system-nsx.svc
    - supervisor-network-migration-admission.vmware-system-nsx.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: supervisor-network-migration-admission
  secretName: supervisor-network-migration-admission-tls
