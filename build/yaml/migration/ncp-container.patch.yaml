# Strategic merge patch for the downstream NCP Deployment; not a standalone Deployment.
# Replace the image with the pinned dedicated migration image.
# Downstream packaging must additionally copy the existing NSX operator's config,
# CA, token/credential mounts and Envoy settings when enabling real handlers.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nsx-ncp
  namespace: vmware-system-nsx
spec:
  template:
    spec:
      containers:
        - name: supervisor-network-migration-operator
          image: supervisor-network-migration-operator:latest
          command: [/usr/local/bin/supervisor-network-migration-operator]
          args:
            - --enable-migration-admission
            - --migration-admission-port=9982
            - --migration-admission-cert-dir=/etc/nsx-operator/migration-webhook-certs
            - --health-probe-bind-address=:9924
            - --metrics-bind-address=0
            - --nsxconfig=/etc/nsx-operator/nsxop.ini
          env:
            - name: NSX_OPERATOR_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: migration-probe
              containerPort: 9924
            - name: migration-admission
              containerPort: 9982
              protocol: TCP
          volumeMounts:
            - name: migration-admission-certs
              mountPath: /etc/nsx-operator/migration-webhook-certs
              readOnly: true
          # Allow Kubernetes API discovery and manager startup before liveness checks.
          startupProbe:
            httpGet:
              path: /healthz
              port: migration-probe
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /healthz
              port: migration-probe
          readinessProbe:
            httpGet:
              path: /readyz
              port: migration-probe
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
      volumes:
        - name: migration-admission-certs
          secret:
            secretName: supervisor-network-migration-admission-tls
