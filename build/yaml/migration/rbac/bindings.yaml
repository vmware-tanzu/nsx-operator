# Match the ServiceAccount on the downstream NCP Deployment if it differs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: supervisor-network-migration-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: supervisor-network-migration-operator
subjects:
  - kind: ServiceAccount
    name: nsx-ncp
    namespace: vmware-system-nsx
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: supervisor-network-migration-operator-leader-election
  namespace: vmware-system-nsx
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: supervisor-network-migration-operator
subjects:
  - kind: ServiceAccount
    name: nsx-ncp
    namespace: vmware-system-nsx
