---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: supervisor-network-migration-operator
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - migration.network.vmware.com
  resources:
  - controlplanenetworktransitions
  - namespacenetworktransitions
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - migration.network.vmware.com
  resources:
  - controlplanenetworktransitions/status
  - namespacenetworktransitions/status
  verbs:
  - patch
- apiGroups:
  - netoperator.vmware.com
  resources:
  - ippools
  - networks
  - vspheredistributednetworks
  verbs:
  - get
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: supervisor-network-migration-operator
  namespace: vmware-system-nsx
rules:
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - create
  - get
  - update
