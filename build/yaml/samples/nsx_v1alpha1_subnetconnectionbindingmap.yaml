apiVersion: crd.nsx.vmware.com/v1alpha1
kind: SubnetConnectionBindingMap
metadata:
  name: binding1
  namespace: default
spec:
  subnetName: subnet-sample
  targetSubnetSetName: vm-default
  vlanTrafficTag: 201
---
apiVersion: crd.nsx.vmware.com/v1alpha1
kind: SubnetConnectionBindingMap
metadata:
  name: binding2
  namespace: default
spec:
  subnetName: subnet-sample
  targetSubnetName: subnet1
  vlanTrafficTag: 202
---
apiVersion: crd.nsx.vmware.com/v1alpha1
kind: SubnetConnectionBindingMap
metadata:
  name: binding-auto
  namespace: default
spec:
  subnetName: vlan-ext-subnet
  targetSubnetSetName: vm-default
  # vlanTrafficTag omitted: operator auto-allocates and populates status.vlanTrafficTag
---
# Cross-VPC VLAN extension: trunk Subnet in VPC-A, branch Subnet in VPC-B
apiVersion: crd.nsx.vmware.com/v1alpha1
kind: SubnetConnectionBindingMap
metadata:
  name: cross-vpc-binding
  namespace: ns-vpc-a
spec:
  subnetName: parent-vlan-subnet
  targetSubnetName: child-vlan-subnet
  subnetAssociation: Branch
  vlanTrafficTag: 201
