apiVersion: migration.network.vmware.com/v1alpha1
kind: ControlPlaneNetworkTransition
metadata:
  name: supervisor-vds-to-vpc
spec:
  sourceMode: VSPHERE_VDS
  targetMode: NSX_VPC
  targetLBProvider: NSX_LB
  action: Evaluate
  networkConfiguration:
    # Optional override when the discovered FLB backend is separate from the
    # VIP and workload networks. If omitted, inspection selects the VIP range
    # and reports a reachability warning for that separate-backend case.
    # Supervisor VDS source networks are IPv4-only in this release.
    # The field remains a list so a future release can add IPv6 support.
    lbSNATIPs: ["10.2.1.50"]
