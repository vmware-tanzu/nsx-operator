apiVersion: migration.network.vmware.com/v1alpha1
kind: ControlPlaneNetworkTransition
metadata:
  name: supervisor-vds-to-vpc
spec:
  sourceMode: VSPHERE_VDS
  targetMode: NSX_VPC
  targetLbProvider: NSX_LB
  action: Evaluate
  networkConfiguration:
    # Supply only when evaluation requests fallback addresses for exhausted VIP pools.
    # Supervisor VDS source networks are IPv4-only in this release.
    # The field remains a list so a future release can add IPv6 support.
    lbSnatIPs: ["10.2.1.50"]
    # Required for a HAProxy source; FLB discovers its frontend port groups.
    sourceLbFrontendDvpgs: ["dvportgroup-1010"]
