apiVersion: migration.vmware.com/v1alpha1
kind: NamespaceNetworkTransition
metadata:
  name: batch-ns-migration-01
spec:
  namespaces: ["ns1", "ns2", "ns3"]
  sourceMode: "VSPHERE_VDS"
  targetMode: "NSX_VPC"
  action: "EVALUATE"                       # EVALUATE | PLAN | DERIVE | EXECUTE | ROLLBACK | COMMIT
  userInputs:
    tenantSubnets:
    - vdn: vdn-tenant-1
      dhcpRange:
        start: "10.2.1.100"
        end: "10.2.1.200"
      subnetMask: "255.255.255.0"
      gatewayAddress: "10.2.1.1"

# After successful EXECUTE, verification, and approval (plus VCFA onboarding when applicable):
# kubectl patch nsnt batch-ns-migration-01 --type=merge -p '{"spec":{"action":"COMMIT"}}'
# COMMIT progresses through Committing -> Committed and closes rollback only after status.irreversibleAction: COMMIT is persisted.
