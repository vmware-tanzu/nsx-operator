apiVersion: migration.network.vmware.com/v1alpha1
kind: ControlPlaneNetworkTransition
metadata:
  name: supervisor-vds-to-vpc
spec:
  sourceMode: VSPHERE_VDS
  targetMode: NSX_VPC
  targetLBProvider: NSX_LB
  action: Evaluate
status:
  lastAction: Evaluate
  actionState: Running
  actionGeneration: 1
  lbSNATIPAllocations:
  # Evaluate allocated this address from a managed source Network.
  - ipAddress: "10.2.1.50"
    allocationRef:
      namespace: vmware-system-netop
      name: migration-lb-snat-ipv4
